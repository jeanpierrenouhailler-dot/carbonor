              "@type": "Question",
              "name": "Quelle est la différence entre CO₂ au sol et XCO₂ ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "La concentration au sol mesure la fraction molaire au niveau du capteur in situ (CRDS ou NDIR), tandis que XCO₂ est la fraction molaire moyenne de la colonne verticale totale d'air sec observée depuis l'espace par spectrométrie satellite."
              }
            },
            {
              "@type": "Question",
              "name": "Pourquoi Carbonor distingue-t-il Mesuré, Observé, Estimé, Modélisé et Simulé ?",

                "@type": "Answer",
                "text": "Par rigueur déontologique : une mesure physico-chimique directe au sol (Mesuré) ne doit jamais être confondue avec une inversion satellitaire indirecte (Observé), un bilan comptable d'émissions (Estimé), une réanalyse numérique 3D (Modélisé) ou un calcul théorique quantique (Simulé)."
              }
            }
