<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A"/>
      <stop offset="50%" stop-color="#102A45"/>
      <stop offset="100%" stop-color="#0A3641"/>
    </linearGradient>
    <linearGradient id="carbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="oxygen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for standalone PWA -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>

  <!-- Orbital / Atmospheric Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#34D399" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Spectral wave across center (15 µm ν2 resonance) -->
  <path d="M 60 256 Q 110 200, 160 256 T 260 256 T 360 256 T 460 256" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.6" filter="url(#glow)"/>
  
  <!-- Chemical Bonds (Double covalent C=O) -->
  <!-- Left double bond -->
  <line x1="165" y1="248" x2="215" y2="248" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="165" y1="264" x2="215" y2="264" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <!-- Right double bond -->
  <line x1="297" y1="248" x2="347" y2="248" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="297" y1="264" x2="347" y2="264" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <!-- Oxygen 1 (Left) -->
  <circle cx="140" cy="256" r="38" fill="url(#oxygen-grad)" filter="url(#glow)"/>
  <text x="140" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">O</text>

  <!-- Carbon (Center) -->
  <circle cx="256" cy="256" r="44" fill="url(#carbon-grad)" filter="url(#glow)"/>
  <text x="256" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>

  <!-- Oxygen 2 (Right) -->
  <circle cx="372" cy="256" r="38" fill="url(#oxygen-grad)" filter="url(#glow)"/>
  <text x="372" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">O</text>

  <!-- Vibrational arrows (Bending mode ν2 at 15 µm: Carbon moves up, Oxygens move down) -->
  <!-- Carbon arrow UP -->
  <path d="M 256 195 L 256 170 M 248 178 L 256 168 L 264 178" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Oxygen arrow DOWN -->
  <path d="M 140 310 L 140 335 M 132 327 L 140 337 L 148 327" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Oxygen arrow DOWN -->
  <path d="M 372 310 L 372 335 M 364 327 L 372 337 L 380 327" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Satellite observation beam icon at top right -->
  <polygon points="410,100 440,110 430,135 400,125" fill="#38BDF8"/>
  <rect x="428" y="105" width="28" height="10" fill="#0284C7" rx="2" transform="rotate(20 428 105)"/>
  <line x1="415" y1="120" x2="385" y2="180" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" stroke-opacity="0.8"/>

  <!-- Labels -->
  <text x="256" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">ATMOSPHERE &amp; CARBONE</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="4">CO₂ OBSERVATORY</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">HITRAN · NOAA · ICOS · OCO-2 · CAMS</text>
</svg>
